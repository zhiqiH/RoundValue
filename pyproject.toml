[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "roundvalue"
version = "0.1.0"
description = "Reproducible multi-agent Debate pipeline with an automatic Single-Agent baseline."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "matplotlib>=3.8",
    "numpy>=1.26",
]

[project.optional-dependencies]
benchmark-build = ["datasets>=3,<5"]

[project.scripts]
roundvalue = "roundvalue_cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["roundvalue_cli"]
