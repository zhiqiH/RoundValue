[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "roundvalue"
version = "1.0.0"
description = "Fixed-topology, reproducible RoundValue debate experiments"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "RoundValue contributors" }]
dependencies = [
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
benchmark-build = [
  "datasets>=3,<5",
]
benchmark-code = [
  "numpy>=1.24,<3",
]

[project.scripts]
roundvalue = "scripts.test_benchmark:main"

[tool.setuptools]
packages = ["scripts"]
